<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Devine mon nombre</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --card:#192438; --text:#f4f7fb; --muted:#aab6c8; --accent:#8b9cff; --line:#34425a; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:radial-gradient(ellipse at top,#263454,var(--bg) 65%); color:var(--text); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif }
    main { width:min(100%,520px); padding:clamp(24px,6vw,40px); border:1px solid var(--line); border-radius:24px; background:rgba(25,36,56,.96); box-shadow:0 24px 70px #0006 }
    h1 { margin:0 0 8px; font-size:clamp(28px,7vw,38px); letter-spacing:-.03em }
    .intro { margin:0 0 26px; color:var(--muted) }
    label { display:block; margin:18px 0 8px; font-weight:650 }
    select,button { width:100%; min-height:50px; border-radius:12px; font:inherit }
    select { padding:0 14px; color:var(--text); background:#111b2b; border:1px solid var(--line) }
    button { margin-top:14px; border:0; color:#111827; background:var(--accent); font-weight:750; cursor:pointer }
    button:hover { filter:brightness(1.08) } button:focus-visible,select:focus-visible { outline:3px solid #fff; outline-offset:3px }
    button.secondary { color:var(--text); background:#2b3952; border:1px solid var(--line) }
    .panel { margin-top:24px; padding:20px; border:1px solid var(--line); border-radius:16px; background:#111b2b }
    .guess { margin:0 0 4px; color:var(--muted) }
    .number { margin:0 0 16px; text-align:center; font-size:72px; line-height:1.1; font-weight:800; letter-spacing:-.05em }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px }
    .actions button { margin:0 }
    .correct { grid-column:1/-1 }
    #message { min-height:48px; margin:16px 0 0; color:var(--muted); text-align:center }
    .hidden { display:none }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
  </style>
</head>
<body>
  <main>
    <h1>Devine mon nombre</h1>
    <p class="intro">Pense à un nombre entier entre 1 et 100. Je vais essayer de le trouver !</p>

    <section id="setup">
      <label for="difficulty">Choisis un niveau de difficulté</label>
      <select id="difficulty">
        <option value="1">Facile — essais au hasard</option>
        <option value="2" disabled>Moyen — bientôt disponible</option>
        <option value="3" disabled>Impossible — bientôt disponible</option>
      </select>
      <button id="start">Commencer</button>
    </section>

    <section id="game" class="panel hidden" aria-live="polite">
      <p class="guess">Mon essai :</p>
      <p id="number" class="number">—</p>
      <p>Mon nombre est-il trop petit, trop grand, ou correct ?</p>
      <div class="actions">
        <button id="higher">Plus</button>
        <button id="lower">Moins</button>
        <button id="correct" class="correct">Correct !</button>
      </div>
      <p id="message" role="status">Dis-moi si ton nombre est plus grand ou plus petit.</p>
      <button id="restart" class="secondary hidden">Recommencer</button>
    </section>
  </main>
  <script>
    const setup = document.querySelector('#setup');
    const game = document.querySelector('#game');
    const number = document.querySelector('#number');
    const message = document.querySelector('#message');
    const restart = document.querySelector('#restart');
    const guessButtons = [...document.querySelectorAll('#higher, #lower, #correct')];
    let min = 1, max = 100, current = 0;

    function nextGuess() {
      if (min > max) {
        message.textContent = 'Tes réponses sont incohérentes : aucun nombre ne correspond. Recommence et vérifie tes indications.';
        finish();
        return;
      }
      current = Math.floor(Math.random() * (max - min + 1)) + min;
      number.textContent = current;
      message.textContent = `Je cherche entre ${min} et ${max}.`;
    }
    function finish() {
      guessButtons.forEach(button => button.disabled = true);
      restart.classList.remove('hidden');
    }
    document.querySelector('#start').addEventListener('click', () => {
      min = 1; max = 100;
      setup.classList.add('hidden');
      game.classList.remove('hidden');
      guessButtons.forEach(button => button.disabled = false);
      restart.classList.add('hidden');
      nextGuess();
    });
    document.querySelector('#higher').addEventListener('click', () => {
      min = current + 1;
      nextGuess();
    });
    document.querySelector('#lower').addEventListener('click', () => {
      max = current - 1;
      nextGuess();
    });
    document.querySelector('#correct').addEventListener('click', () => {
      message.textContent = 'Gg, c’était cool ! Noob, trop prévisible 😄';
      finish();
    });
    restart.addEventListener('click', () => {
      game.classList.add('hidden');
      setup.classList.remove('hidden');
    });
  </script>
</body>
</html>
